name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Validate (SEO + A11y + Syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          for f in js/*.js; do
            node --check "$f"
          done

      - name: SEO validation
        run: node scripts/validate-seo.mjs

      - name: A11y audit
        run: node scripts/audit-a11y.mjs

      - name: Full audit
        run: node scripts/audit.mjs

      - name: SRI verification
        run: |
          grep -q 'integrity="sha384' index.html || (echo "SRI missing!" && exit 1)
          echo "SRI present"

  build:
    name: Build (optimize assets)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - name: Optimize assets
        run: |
          node scripts/generate-pwa-icons.mjs
          node scripts/optimize-images.mjs
          node scripts/optimize-videos.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optimized-assets
          path: |
            img/pwa/
            img/*.avif
            img/*.webp
            img/*.png
            video/
          if-no-files-found: warn
